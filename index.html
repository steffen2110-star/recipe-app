<html lang="en">

<title>My Kitchen</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --ink: #1d1d1f; --muted: #6b6b70;
    --line: #e4e2dc; --accent: #2f6f4e; --accent-soft: #e8f3ed;
    --danger: #b42318; --danger-soft: #fdf0ee; --radius: 14px;
    --orange: #e07a1f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0 auto; padding: 16px; max-width: 640px;
    background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 17px; line-height: 1.45;
  }
  h1 { font-size: 28px; margin: 4px 0 12px; letter-spacing: -0.02em; }
  h2 { font-size: 22px; margin: 18px 0 8px; }
  h3 { font-size: 17px; margin: 16px 0 6px; }
  ul, ol { padding-left: 22px; }
  li { margin: 4px 0; }

  button {
    font: inherit; font-size: 16px; padding: 10px 16px; margin: 4px 6px 4px 0;
    border-radius: 999px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); cursor: pointer;
    transition: transform .08s ease, background .15s ease;
  }
  button:active { transform: scale(0.97); }
  button[onclick^="save"], button[onclick^="addPlanEntry"],
  button[onclick^="buildShop"], button[onclick^="markCooked"],
  button[onclick^="connect"], button[onclick^="confirmBulk"],
  button[onclick^="publishFamilyView"], button[onclick^="openSharedPicker"] {
    background: var(--accent); border-color: var(--accent); color: #fff;
  }
  .mini { font-size: 13px; padding: 4px 10px; margin: 2px 4px 2px 0; }
  a.mini {
    display: inline-block; text-decoration: none; color: var(--ink);
    border: 1px solid var(--line); border-radius: 999px; background: var(--card);
    padding: 4px 10px; font-size: 13px; margin: 2px 4px 2px 0;
  }
  .mini.accent { background: var(--orange); border-color: var(--orange); color: #fff; }
  .top-btn { background: #2e7d32; border-color: #2e7d32; color: #fff; }
  .btn-pass { background: #c62828; border-color: #c62828; color: #fff; font-size: 18px; padding: 12px 22px; }
  .btn-save { background: #2e7d32; border-color: #2e7d32; color: #fff; font-size: 18px; padding: 12px 22px; }
  .row-btns { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0; }

  input, textarea, select {
    width: 100%; font: inherit; font-size: 16px; padding: 10px 12px;
    margin: 4px 0 10px; border: 1px solid var(--line); border-radius: 10px;
    background: #fff; color: var(--ink);
  }
  input:focus, textarea:focus, select:focus {
    outline: 2px solid var(--accent-soft); border-color: var(--accent);
  }
  input[type=checkbox] { width: auto; margin: 0 8px 0 0; accent-color: var(--accent); }
  label { display: block; font-size: 15px; color: var(--muted); margin-bottom: 6px; }
  label.check { color: var(--ink); font-size: 16px; }

  /* Top-level sections */
  #topnav {
    display: flex; gap: 4px; overflow-x: auto; padding: 4px; margin: 10px 0 10px;
    background: var(--card); border: 1px solid var(--line); border-radius: 999px;
  }
  #topnav button {
    flex: 1; margin: 0; padding: 9px 10px; border: none; background: transparent;
    white-space: nowrap; font-size: 15px; color: var(--muted); font-weight: 600;
  }
  #topnav button.active { background: var(--ink); color: #fff; }

  /* Sub-tabs */
  .subnav { display: flex; gap: 6px; margin: 6px 0 10px; flex-wrap: wrap; }
  .subnav button { flex: 1; margin: 0; padding: 6px 8px; font-size: 15px; }
  .subnav button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  /* Recipe categories: light green, dark green when selected */
  .subnav button.cat { background: #e3f5e6; border-color: #8fcf9d; color: #1d3d26; }
  .subnav button.cat.active { background: #2e7d32; border-color: #2e7d32; color: #fff; }

  /* Inventory storage tabs with their colours */
  .storage-nav { display: flex; gap: 6px; margin: 6px 0 10px; }
  .storage-nav button { flex: 1; margin: 0; padding: 8px; font-size: 15px; font-weight: 700; border: 2px solid transparent; }
  .storage-nav button.active { outline: 3px solid var(--ink); outline-offset: 2px; }
  .storage-nav .st-freezer { background: #1d3f8f; color: #fff; }
  .storage-nav .st-fridge { background: #bfe6f7; color: #0b3b52; }
  .storage-nav .st-pantry { background: #c8a27a; color: #2a1a0a; }

  .line {
    display: flex; align-items: center; gap: 6px; min-height: 40px;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 6px 10px; margin: 4px 0; font-size: 15px;
  }
  .line .mini { flex: none; }
  .line.st-freezer { border-left: 6px solid #1d3f8f; }
  .line.st-fridge { border-left: 6px solid #7cc8ec; }
  .line.st-pantry { border-left: 6px solid #a9784b; }
  .ell { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .line input[type=checkbox] { margin: 0; flex: none; }

  .plan-add { display: flex; gap: 4px; align-items: center; margin: 6px 0 10px; flex-wrap: wrap; }
  .plan-add > * { flex: none; margin: 0; font-size: 14px; padding: 7px 8px; }
  .plan-add .pa-recipe { flex: 1 1 auto; min-width: 0; width: auto; }
  .plan-add .pa-date { width: 124px; }
  .plan-add .pa-meal { width: 98px; }
  .plan-add .pa-serv { width: 58px; }
  .plan-add button { border-radius: 10px; }

  .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .head b { font-size: 18px; }
  .head h2 { margin: 12px 0 8px; }

  .top-wrap {
    background: #cdeed4; border: 1px solid #6fbf7f; border-radius: var(--radius);
    padding: 12px; margin-top: 8px;
  }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px 16px; margin: 10px 0; box-shadow: 0 1px 2px rgba(0,0,0,.04);
  }
  .card b { font-size: 18px; }
  .warn { border-color: var(--danger); background: var(--danger-soft); }
  .cooked { border-color: var(--accent); background: var(--accent-soft); }
  .notice {
    background: #fff8e6; border: 1px solid #f1d28a; border-radius: 10px;
    padding: 10px 12px; font-size: 15px; margin-bottom: 10px;
  }
  .small { color: var(--muted); font-size: 14px; }
  .driveb { font-weight: 700; color: #1d5fa8; margin: 2px 0; }
  .hh { font-size: 14px; color: #7a4a00; background: #fff4df; border-radius: 8px; padding: 6px 8px; margin: 6px 0; }
  .hhnow { color: #2e7d32; }
  .alert { color: var(--danger); font-weight: 600; font-size: 14px; margin: 4px 0; }
  .done { text-decoration: line-through; color: #9a9a9f; }

  .sync {
    display: flex; flex-direction: column; gap: 6px; font-size: 14px;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 12px; margin-top: 18px;
  }
  .sync.err { background: var(--danger-soft); color: var(--danger); border-color: #f3c4bf; }
  .sync button { font-size: 14px; padding: 6px 12px; margin: 0 4px 0 0; }

  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .row > * { flex: 1 1 140px; }
  .check-grid label { display: block; margin: 8px 0; font-size: 16px; color: var(--ink); }

  .thumb { width: 72px; height: 72px; object-fit: cover; border-radius: 10px; float: right; margin-left: 10px; }
  .gallery img { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; margin: 6px 4px 0 0; }
  .pphoto { width: 104px; text-align: center; margin: 4px; display: inline-block; vertical-align: top; }
  .pphoto img { width: 96px; height: 96px; object-fit: cover; border-radius: 10px; display: block; margin: 0 auto 4px; }

  .swipe-wrap { position: relative; margin: 12px 0; }
  .swipe-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: 20px; box-shadow: 0 6px 18px rgba(0,0,0,.08);
    touch-action: none; user-select: none;
  }
  .swipe-card ul { padding-left: 20px; }
  .hint {
    position: absolute; top: 40%; left: 50%;
    transform: translate(-50%, -50%) scale(.85);
    font-size: 34px; font-weight: 800; letter-spacing: 1px;
    padding: 8px 20px; border-radius: 14px; border: 4px solid;
    background: rgba(255,255,255,.92); opacity: 0; pointer-events: none;
    z-index: 5; transition: opacity .1s ease, transform .1s ease;
  }
  .hint.save { opacity: 1; color: #2e7d32; border-color: #2e7d32; transform: translate(-50%, -50%) scale(1); }
  .hint.pass { opacity: 1; color: #c62828; border-color: #c62828; transform: translate(-50%, -50%) scale(1); }
  .swipe-btns { justify-content: center; margin: 8px 0 12px; }

  .photo { width: 100%; max-height: 260px; object-fit: cover; border-radius: var(--radius); margin: 8px 0; display: block; }
  .photo-actions { margin: 6px 0 10px; }

  .stars { color: #e0a800; font-size: 18px; letter-spacing: 2px; margin: 4px 0; }
  .stars .off { color: #d6d3cb; }
  .stars-inline { color: #e0a800; font-size: 16px; letter-spacing: 1px; white-space: nowrap; }
  .stars-inline .off { color: #d6d3cb; }
  .stars-pick { margin: 6px 0 10px; }
  .stars-pick .star { font-size: 32px; color: #d6d3cb; cursor: pointer; padding: 0 4px; display: inline-block; user-select: none; }
  .stars-pick .star.on { color: #e0a800; }

  #print { display: none; }
  @media print {
    body > *:not(#print) { display: none !important; }
    #print { display: block !important; color: #000; background: #fff; }
    #print h1 { font-size: 26px; margin-bottom: 4px; }
    #print h2 { font-size: 20px; margin-top: 16px; }
    #print li { margin: 4px 0; }
  }
</style>

// ---- Helpers ----
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function isoDate(d) { return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
function addDays(n) { const d = new Date(); d.setDate(d.getDate() + n); return isoDate(d); }
function daysUntil(dateStr) {
  const [y, m, d] = dateStr.split("-").map(Number);
  const target = new Date(y, m - 1, d);
  const today = new Date(); today.setHours(0, 0, 0, 0);
  return Math.round((target - today) / 86400000);
}
function niceDate(s) {
  const [y, m, d] = s.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
}

  const [y, m, d] = s.split("-");
  return `${d}.${m}.${y}`;
}
// Recipes saved before categories existed count as Cooking.
function catOf(r) { return CATS.includes(r.category) ? r.category : DEFAULT_CAT; }
// Accepts any capitalisation from a CSV file; unknown values become Cooking.
function normCat(v) {
  const f = CATS.find(c => c.toLowerCase() === String(v || "").trim().toLowerCase());
  return f || DEFAULT_CAT;
}

function parseQty(s) {
  const m = s.match(/^\s*(\d+\s+\d+\/\d+|\d+\/\d+|\d+(\.\d+)?)/);
  if (!m) return null;
  const t = m[1].trim();
  let v;
  if (t.includes(" ")) { const [w, f] = t.split(/\s+/); const [a, b] = f.split("/"); v = +w + a / b; }
  else if (t.includes("/")) { const [a, b] = t.split("/"); v = a / b; }
  else v = parseFloat(t);
  return { v, len: m[0].length };
}
function fmt(n) { return String(Math.round(n * 100) / 100); }
function scaleLine(line, factor) {
  const q = parseQty(line);
  if (!q) return line;
  return fmt(q.v * factor) + line.slice(q.len);
}

// Splits "1 1/2 cups all-purpose flour, sifted" into qty, unit and name.
function parseIng(line) {
  const q = parseQty(line);
  if (!q) return { qty: null, unit: "count", name: "" };
  let rest = line.slice(q.len).trim();
  const words = rest.split(/\s+/);
  let unit = "count";
  const two = (words[0] + " " + (words[1] || "")).toLowerCase().replace(/\.$/, "");
  if (UNITS[two] && words[1]) { unit = UNITS[two]; rest = words.slice(2).join(" "); }
  else {
    const one = (words[0] || "").toLowerCase().replace(/\.$/, "");
    if (UNITS[one]) { unit = UNITS[one]; rest = words.slice(1).join(" "); }
  }
  rest = rest.trim().replace(/^of\s+/i, "").replace(/\(.*?\)/g, "").split(",")[0].trim().toLowerCase();
  return { qty: q.v, unit, name: rest };
}
function normUnit(u) {
  const x = (u || "").trim().toLowerCase().replace(/\.$/, "");
  if (!x) return "count";
  return UNITS[x] || x;
}
function unitLabel(key) {
  const o = UNIT_OPTIONS.find(([v]) => v === key);
  return o ? o[1].split(" ")[0] : (key || "");
}
function kindOf(unit) {
  if (MASS[unit]) return { kind: "mass", factor: MASS[unit] };
  if (VOL[unit]) return { kind: "vol", factor: VOL[unit] };
  return { kind: unit, factor: 1 };
}
function namesMatch(a, b) {
  a = a.toLowerCase().trim(); b = b.toLowerCase().trim();
  if (!a || !b) return false;
  if (a === b) return true;
  return Math.min(a.length, b.length) >= 3 && (a.includes(b) || b.includes(a));
}

// Longest matching key wins, and plurals ("eggs") match too.
function lookup(name, table) {
  const n = (name || "").toLowerCase();
  let best = null, bestLen = 0;
  for (const [k, v] of Object.entries(table)) {
    if (k.length > bestLen && new RegExp("\\b" + k + "s?\\b").test(n)) { best = v; bestLen = k.length; }
  }
  return best;
}
function gramsPerCup(name) { return lookup(name, DENSITY); }

function normalizeNeed(qty, unit, name) {
  const k = kindOf(unit);
  if (k.kind === "vol") {
    const d = gramsPerCup(name);
    if (d) return { kind: "mass", amount: qty * k.factor / 236.6 * d };
  }
  return { kind: k.kind, amount: qty * k.factor };
}

function amountIn(wantKind, qty, unit, name) {
  const k = kindOf(unit);
  if (k.kind === wantKind) return qty * k.factor;
  const d = gramsPerCup(name);
  if (!d) return null;
  if (wantKind === "mass" && k.kind === "vol") return qty * k.factor / 236.6 * d;
  if (wantKind === "vol" && k.kind === "mass") return qty * k.factor / d * 236.6;
  return null;
}

function fmtAmount(kind, base) {
  if (kind === "mass") return base >= 1000 ? fmt(base / 1000) + " kg" : Math.round(base) + " g";
  if (kind === "vol") return base >= 1000 ? fmt(base / 1000) + " l" : Math.round(base) + " ml";
  if (kind === "count") return fmt(base);
  return fmt(base) + " " + kind;
}
function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

// Stars next to a title, e.g. ★★★☆☆ (inline version for headers)
function starsInline(n) {
  if (!n) return `<span class="small">Not rated yet</span>`;
  return `<span class="stars-inline" aria-label="${n} of 5 stars">${"★".repeat(n)}<span class="off">${"★".repeat(5 - n)}</span></span>`;
}

// ---- Temperatures ----
// Adds the other unit in brackets: "165 °C" becomes "165 °C (329 °F)". Stored text is not changed.
function tempText(s) {
  const toF = c => Math.round(c * 9 / 5 + 32);
  const toC = f => Math.round((f - 32) * 5 / 9);
  return String(s).replace(
    /(-?\d+(?:[.,]\d+)?)\s*(?:[°º]\s*([CcFf])\b|(?:degrees?|grad)\s*(?:[°º]\s*)?(Celsius|Fahrenheit|[CcFf])\b|(Celsius|Fahrenheit)\b)/gi,
    (m, num, l1, l2, l3, offset, str) => {
      const after = str.slice(offset + m.length);
      if (/^\s*\(\s*-?\d/.test(after)) return m;
      const letter = (l1 || l2 || l3 || "").toLowerCase();
      if (!letter) return m;
      const n = parseFloat(num.replace(",", "."));
      if (letter.startsWith("c")) return `${num} °C (${toF(n)} °F)`;
      return `${num} °F (${toC(n)} °C)`;
    });
}

// ---- Google Drive sync ----
function isConnected() { return !!localStorage.getItem(CONNECTED_KEY); }
function localUpdated() { return Number(localStorage.getItem(UPDATED_KEY) || 0); }
function hasLocalData() { return recipes.length || inventory.length || plan.length || places.length; }
function timeNow() { return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); }

function setSyncStatus(msg, isErr) {
  const el = document.getElementById("sync");
  if (!el) return;
  el.className = isErr ? "sync err" : "sync";
  const buttons = isConnected()
    ? `<button onclick="syncNow()">Sync now</button> <button onclick="connect()">Sign in again</button> <button onclick="disconnect()">Disconnect</button>`
    : `<button onclick="connect()">Connect Google Drive</button>`;
  el.innerHTML = `<span>${esc(msg)}</span><div>${buttons}</div>`;
}

function initAuth() {
  if (typeof google === "undefined" || !google.accounts) {
    setSyncStatus("Google sign-in did not load. Check your internet connection and reload.", true);
    return false;
  }
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPE,
    callback: r => {
      const p = pendingToken; pendingToken = null;
      if (r.error) { if (p) p.reject(new Error(r.error)); return; }
      accessToken = r.access_token;
      tokenExpiry = Date.now() + (Number(r.expires_in) || 3600) * 1000 - 60000;
      if (p) p.resolve();
    },
    error_callback: err => {
      const p = pendingToken; pendingToken = null;
      if (p) p.reject(new Error(err.type || "sign-in was cancelled"));
    }
  });
  return true;
}

function getToken(interactive) {
  if (accessToken && Date.now() < tokenExpiry) return Promise.resolve();
  if (!tokenClient) return Promise.reject(new Error("Google sign-in is not ready"));
  return new Promise((resolve, reject) => {
    pendingToken = { resolve, reject };
    tokenClient.requestAccessToken({ prompt: interactive ? "" : "none" });
  });
}

async function connect() {
  if (CLIENT_ID.startsWith("PASTE")) {
    return alert("Paste your Client ID into the code first (see the CLIENT_ID line near the top).");
  }
  if (!tokenClient && !initAuth()) return;
  try {
    await getToken(true);
    localStorage.setItem(CONNECTED_KEY, "1");
    await syncNow();
  } catch (e) {
    setSyncStatus("Sign-in failed: " + e.message, true);
  }
}

function disconnect() {
  localStorage.removeItem(CONNECTED_KEY);
  accessToken = null;
  clearTimeout(syncTimer);
  setSyncStatus("Disconnected. Your recipes stay on this device.");
}

async function driveFetch(url, opts = {}) {
  await getToken(false);
  const headers = { Authorization: "Bearer " + accessToken, ...(opts.headers || {}) };
  const r = await fetch(url, { ...opts, headers });
  if (r.status === 401) { accessToken = null; throw new Error("sign-in expired, tap Sign in again"); }
  return r;
}

function forgetFileId() {
  driveFileId = null;
  localStorage.removeItem(DRIVE_ID_KEY);
}

async function downloadSnapshot() {
  if (!driveFileId) {
    const q = encodeURIComponent(`name='${SYNC_FILE}' and trashed=false`);
    const r = await driveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id)`);
    if (!r.ok) throw new Error("Drive search failed (" + r.status + ")");
    const d = await r.json();
    if (!d.files || !d.files.length) return null;
    driveFileId = d.files[0].id;
    localStorage.setItem(DRIVE_ID_KEY, driveFileId);
  }
  const r = await driveFetch(`https://www.googleapis.com/drive/v3/files/${driveFileId}?alt=media`);
  if (r.status === 404) { forgetFileId(); return null; }
  if (!r.ok) throw new Error("download failed (" + r.status + ")");
  return await r.json();
}

async function uploadSnapshot(snap) {
  const body = JSON.stringify(snap);
  if (driveFileId) {
    const r = await driveFetch(`https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=media`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body
    });
    if (r.status === 404) { forgetFileId(); return uploadSnapshot(snap); }
    if (!r.ok) throw new Error("upload failed (" + r.status + ")");
    return;
  }
  const boundary = "kitchen" + Date.now();
  const meta = JSON.stringify({ name: SYNC_FILE, mimeType: "application/json" });
  const multi = `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n` +
    `--${boundary}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${boundary}--`;
  const r = await driveFetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id", {
    method: "POST",
    headers: { "Content-Type": `multipart/related; boundary=${boundary}` },
    body: multi
  });
  if (!r.ok) throw new Error("create failed (" + r.status + ")");
  const d = await r.json();
  driveFileId = d.id;
  localStorage.setItem(DRIVE_ID_KEY, driveFileId);
}

function snapshot() {
  return { version: 4, updatedAt: localUpdated(), recipes, inventory, plan, places, shop, swipe, profile };
}

function applySnapshot(s) {
  recipes = s.recipes || [];
  inventory = s.inventory || [];
  plan = s.plan || [];
  places = s.places || [];
  shop = s.shop || { checked: {}, manual: [] };
  swipe = s.swipe || { liked: [], passed: [] };
  profile = { defaultServings: 4, allergens: [], showCalories: true, homeAddress: "", ...(s.profile || {}) };
  localStorage.setItem(RKEY, JSON.stringify(recipes));
  localStorage.setItem(IKEY, JSON.stringify(inventory));
  localStorage.setItem(PKEY, JSON.stringify(plan));
  localStorage.setItem(PLKEY, JSON.stringify(places));
  localStorage.setItem(SKEY, JSON.stringify(shop));
  localStorage.setItem(SWKEY, JSON.stringify(swipe));
  localStorage.setItem(PRKEY, JSON.stringify(profile));
  localStorage.setItem(UPDATED_KEY, String(s.updatedAt || 0));
}

async function syncNow() {
  if (!isConnected()) return;
  if (syncBusy) { syncQueued = true; return; }
  syncBusy = true;
  setSyncStatus("Syncing…");
  try {
    if (!localUpdated() && hasLocalData()) localStorage.setItem(UPDATED_KEY, String(Date.now()));

    const remote = await downloadSnapshot();
    const remoteNewer = remote && (remote.updatedAt || 0) > localUpdated();
    const emptyHere = localUpdated() === 0 && !hasLocalData();

    if (remote && (remoteNewer || emptyHere)) {
      applySnapshot(remote);
      localDirty = false;
      render();
      setSyncStatus("✓ Updated from Google Drive at " + timeNow());
    } else if (localDirty || !remote) {
      await uploadSnapshot(snapshot());
      localDirty = false;
      setSyncStatus("✓ Saved to Google Drive at " + timeNow());
    } else {
      setSyncStatus("✓ Up to date with Google Drive at " + timeNow());
    }
  } catch (e) {
    setSyncStatus("Sync problem: " + e.message + ". Your data is still saved on this device.", true);
  } finally {
    syncBusy = false;
    if (syncQueued) { syncQueued = false; syncNow(); }
  }
}

function scheduleSync() {
  if (!isConnected()) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncNow, 1500);
}

// ---- Shared kitchen (Google Picker) ----
function loadPicker() {
  return new Promise((resolve, reject) => {
    if (pickerReady) return resolve();
    if (!window.gapi) return reject(new Error("Google Picker did not load. Check your connection and reload."));
    gapi.load("picker", {
      callback: () => { pickerReady = true; resolve(); },
      onerror: () => reject(new Error("Picker failed to load"))
    });
  });
}

// Opens Google's file chooser. Only the file the user picks is granted to the app.
async function openSharedPicker() {
  if (CLIENT_ID.startsWith("PASTE")) return alert("Paste your Client ID into the code first.");
  if (!PICKER_KEY) {
    const k = prompt("Paste your Google Picker API key. It is stored only on this device.");
    if (!k || !k.trim()) return;
    PICKER_KEY = k.trim();
    localStorage.setItem("picker_key_v1", PICKER_KEY);
  }
  try {
    await getToken(true);
    await loadPicker();
    const view = new google.picker.DocsView(google.picker.ViewId.DOCS);
    const picker = new google.picker.PickerBuilder()
      .setAppId(PROJECT_NUMBER)
      .setOAuthToken(accessToken)
      .setDeveloperKey(PICKER_KEY)
      .addView(view)
      .setTitle("Choose my-kitchen.json")
      .setCallback(data => {
        if (data.action === google.picker.Action.PICKED) linkSharedFile(data.docs[0].id);
      })
      .build();
    picker.setVisible(true);
  } catch (e) {
    alert("Could not open the file picker: " + e.message);
  }
}

// Switches this device to the shared file and loads its data.
async function linkSharedFile(id) {
  if (hasLocalData() && !confirm("Use the shared kitchen? This device's current recipes, inventory and plan will be replaced with the shared file's data.")) return;
  localStorage.setItem(SHARED_KEY, id);
  localStorage.setItem(DRIVE_ID_KEY, id);
  localStorage.setItem(CONNECTED_KEY, "1");
  driveFileId = id;
  try {
    const remote = await downloadSnapshot();
    if (!remote) throw new Error("the file is empty or could not be read");
    applySnapshot(remote);
    localDirty = false;
    render();
    setSyncStatus("✓ Connected to the shared kitchen at " + timeNow());
  } catch (e) {
    setSyncStatus("Could not open the shared file: " + e.message, true);
  }
}

// ---- Family view (read-only Google Doc) ----
function familyUrl() {
  const id = localStorage.getItem(FAMILY_KEY);
  return id ? `https://docs.google.com/document/d/${id}/view` : "";
}

function familyLinkHtml() {
  const url = familyUrl();
  return url
    ? `<p class="small">Current link: <a href="${url}" target="_blank" rel="noopener">${url}</a></p>`
    : `<p class="small">Not created yet.</p>`;
}

// Restaurants and playgrounds for the family view (no photos, to keep the document simple).
function placesFamilyHtml() {
  const rest = placesOf("restaurant").sort((a, b) => a.name.localeCompare(b.name));
  const play = placesOf("playground").sort((a, b) => a.name.localeCompare(b.name));
  const extra = p => [
    p.rating ? p.rating + "/5 stars" : "",
    p.address || "",
    p.driveMin != null ? p.driveMin + " min from home" : "",
    visitCount(p) ? "visited " + visitCount(p) + "×, last " + fmtDate(lastVisit(p)) : ""
  ].filter(Boolean).map(esc).join(" · ");
  const restHtml = rest.map(p => `<li><b>${esc(p.name)}</b>${p.cuisine ? " (" + esc(p.cuisine) + ")" : ""}<br>${extra(p)}${p.happyHour ? `<br>🍸 Happy Hour: ${esc(hhLine(p))}${p.hhDeal ? " – " + esc(p.hhDeal) : ""}` : ""}${p.notes ? `<br>${esc(p.notes)}` : ""}</li>`).join("");
  const playHtml = play.map(p => `<li><b>${esc(p.name)}</b> (${esc(p.zone || "")})${p.price ? " · " + esc(p.price) : ""}<br>${extra(p)}${p.notes ? `<br>${esc(p.notes)}` : ""}</li>`).join("");
  return `<h2>Restaurants</h2>${restHtml ? `<ul>${restHtml}</ul>` : "<p>No restaurants yet.</p>"}
    <h2>Playgrounds</h2>${playHtml ? `<ul>${playHtml}</ul>` : "<p>No playgrounds yet.</p>"}`;
}

// Builds a simple HTML page. Google Drive converts it into a Google Doc.
function familyHtml() {
  const recs = recipes.map(r => `<h2>${esc(r.title)}</h2>
    <p>${esc(catOf(r))} · Serves ${r.servings} · Active ${r.activeMin} min · Total ${r.totalMin} min${r.rating ? " · Rating " + r.rating + "/5" : ""}</p>
    <h3>Ingredients</h3><ul>${r.ingredients.map(i => `<li>${esc(i)}</li>`).join("")}</ul>
    <h3>Steps</h3><ol>${r.steps.map(s => `<li>${esc(tempText(s))}</li>`).join("")}</ol>`).join("");
  const inv = inventory.filter(i => !i.used).map(i =>
    `<li>${esc(i.name)} · ${esc(i.qty)} ${esc(unitLabel(i.unit))} · ${esc(i.storage)}${i.expiry ? " · Exp. " + esc(fmtDate(i.expiry)) : ""}</li>`).join("");
  return `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Our Kitchen</title></head><body>
    <h1>Our Kitchen</h1>
    <p>Updated ${new Date().toLocaleString()}. Read-only copy. Photos are not included.</p>
    <h2>Recipes</h2>${recs || "<p>No recipes yet.</p>"}
    <h2>Inventory</h2>${inv ? `<ul>${inv}</ul>` : "<p>Nothing in inventory.</p>"}
    ${placesFamilyHtml()}
  </body></html>`;
}

// Creates the Doc and shares it as view-only with anyone who has the link.
async function createFamilyDoc(html) {
  const boundary = "family" + Date.now();
  const meta = JSON.stringify({ name: "Our Kitchen (family view)", mimeType: "application/vnd.google-apps.document" });
  const body = `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n` +
    `--${boundary}\r\nContent-Type: text/html; charset=UTF-8\r\n\r\n${html}\r\n--${boundary}--`;
  const r = await driveFetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id", {
    method: "POST",
    headers: { "Content-Type": `multipart/related; boundary=${boundary}` },
    body
  });
  if (!r.ok) throw new Error("create failed (" + r.status + ")");
  const d = await r.json();
  const p = await driveFetch(`https://www.googleapis.com/drive/v3/files/${d.id}/permissions`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ type: "anyone", role: "reader" })
  });
  if (!p.ok) throw new Error("sharing failed (" + p.status + ")");
  localStorage.setItem(FAMILY_KEY, d.id);
  return d.id;
}

// Refreshes the existing Doc. If Google refuses the update, a new Doc is created.
async function publishFamilyView() {
  if (!isConnected()) return alert("Connect Google Drive first (see the status bar at the bottom).");
  const html = familyHtml();
  const id = localStorage.getItem(FAMILY_KEY);
  try {
    let replaced = false;
    if (id) {
      const r = await driveFetch(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`, {
        method: "PATCH",
        headers: { "Content-Type": "text/html; charset=UTF-8" },
        body: html
      });
      if (!r.ok) {
        localStorage.removeItem(FAMILY_KEY);
        await createFamilyDoc(html);
        replaced = true;
      }
    } else {
      await createFamilyDoc(html);
      replaced = true;
    }
    render();
    alert("Family view updated." + (replaced ? " The link has changed, so share the new one. You can delete the old Doc in Drive." : "") + "\n\n" + familyUrl());
  } catch (e) {
    alert("Could not update the family view: " + e.message);
  }
}

// ---- Document import ----
async function extractPdf(buf) {
  if (!window.pdfjsLib) throw new Error("the PDF reader did not load; check your internet connection and reload");
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  let out = "";
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    for (const item of content.items) out += item.str + (item.hasEOL ? "\n" : " ");
    out += "\n";
  }
  return out;
}

async function extractDocx(buf) {
  if (!window.mammoth) throw new Error("the Word reader did not load; check your internet connection and reload");
  const r = await mammoth.extractRawText({ arrayBuffer: buf });
  return r.value;
}

async function importFile(input) {
  const file = input.files[0];
  input.value = "";
  if (!file) return;
  const name = file.name.toLowerCase();
  try {
    let text;
    if (name.endsWith(".pdf")) text = await extractPdf(await file.arrayBuffer());
    else if (name.endsWith(".docx")) text = await extractDocx(await file.arrayBuffer());
    else if (name.endsWith(".txt")) text = await file.text();
    else return alert("Please choose a PDF, DOCX or TXT file.");
    if (!text.trim()) return alert("No text found. This may be a scanned document, which needs OCR (not added yet).");
    openReview(parseRecipeText(text), file.name);
  } catch (e) {
    alert("Could not read the file: " + e.message);
  }
}

function parseRecipeText(text) {
  const lines = text.split(/\r?\n/).map(l => l.replace(/\s+/g, " ").trim()).filter(Boolean);
  const out = { title: "", servings: profile.defaultServings, activeMin: 0, totalMin: 0, ingredients: [], steps: [] };
  const unsorted = [];
  let mode = "header";
  let prepCook = 0, totalFound = 0, headingsFound = false;

  for (const line of lines) {
    if (/^ingredients?:?$/i.test(line)) { mode = "ing"; headingsFound = true; continue; }
    if (/^(instructions?|directions?|method|steps?|preparation):?$/i.test(line)) { mode = "steps"; headingsFound = true; continue; }

    if (mode === "ing") {
      out.ingredients.push(line.replace(/^[-•*]\s*/, ""));
    } else if (mode === "steps") {
      const isNewStep = /^(\d+[.)]|[-•*])\s+/.test(line);
      const clean = line.replace(/^(\d+[.)]|[-•*])\s+/, "");
      if (isNewStep || out.steps.length === 0) out.steps.push(clean);
      else out.steps[out.steps.length - 1] += " " + clean;
    } else {
      if (!out.title) { out.title = line; continue; }
      const sv = line.match(/(?:serves|servings|yield|makes)\D{0,5}(\d+)/i);
      if (sv) out.servings = +sv[1];
      const tot = line.match(/total[^\d]{0,15}(\d+)\s*min/i);
      if (tot) totalFound = +tot[1];
      for (const m of line.matchAll(/(prep|cook|active)\w*[^\d]{0,15}(\d+)\s*min/gi)) prepCook += +m[2];
      if (!sv && !tot && !/(prep|cook|active)\w*[^\d]{0,15}\d+\s*min/i.test(line)) unsorted.push(line);
    }
  }

  out.activeMin = prepCook;
  out.totalMin = totalFound || prepCook;
  out.noHeadings = !headingsFound;
  if (!headingsFound) out.ingredients = unsorted;
  return out;
}

// ---- Allergens and calories ----
function recipeAllergens(r) {
  const text = r.ingredients.join(" ").toLowerCase();
  return ALLERGENS.filter(a => a.words.some(w => new RegExp("\\b" + w + "s?\\b").test(text)));
}

function allergenBadge(r) {
  const found = recipeAllergens(r);
  if (!found.length) return "";
  const mine = found.filter(a => profile.allergens.includes(a.key));
  if (mine.length) {
    return `<div class="alert">⚠ Contains your allergen: ${esc(mine.map(a => a.label).join(", "))}</div>`;
  }
  return `<div class="small">Contains: ${esc(found.map(a => a.label).join(", "))}</div>`;
}

function nutrition(r) {
  let total = 0, missing = 0;
  for (const line of r.ingredients) {
    const p = parseIng(line);
    if (p.qty === null || !p.name) { missing++; continue; }
    let grams = null;
    if (p.unit === "count") {
      const g = lookup(p.name, GRAMS_PER_COUNT);
      if (g) grams = p.qty * g;
    } else {
      const need = normalizeNeed(p.qty, p.unit, p.name);
      if (need.kind === "mass") grams = need.amount;
    }
    const kcal = lookup(p.name, KCAL_PER_100G);
    if (grams === null || kcal === null) { missing++; continue; }
    total += grams / 100 * kcal;
  }
  return { perServing: total / (r.servings || 1), missing };
}

function calorieLine(r) {
  if (!profile.showCalories) return "";
  const n = nutrition(r);
  if (n.perServing === 0 && n.missing === r.ingredients.length) {
    return `<div class="small">Calories: not enough data to estimate</div>`;
  }
  return `<div class="small">About ${Math.round(n.perServing)} kcal per serving${n.missing ? ` · ${n.missing} ingredient(s) not counted` : ""}</div>`;
}

// ---- Print and share ----
function currentFactor(r) {
  return (view.recipeId === r.id && view.servings) ? view.servings / r.servings : 1;
}

function recipeDocBody(r, f) {
  const srv = fmt(r.servings * f);
  const found = recipeAllergens(r).map(a => a.label);
  return `<h1>${esc(r.title)}</h1>
    <p>${esc(catOf(r))} · Serves ${srv} · Active ${r.activeMin} min · Total ${r.totalMin} min</p>
    ${found.length ? `<p><b>Contains:</b> ${esc(found.join(", "))}</p>` : ""}
    <h2>Ingredients</h2>
    <ul>${r.ingredients.map(i => `<li>${esc(scaleLine(i, f))}</li>`).join("")}</ul>
    <h2>Steps</h2>
    <ol>${r.steps.map(s => `<li>${esc(tempText(s))}</li>`).join("")}</ol>
    <p class="small">Source: ${esc(r.source || "Manual entry")}</p>`;
}

function printRecipe(id) {
  const r = recipes.find(x => x.id === id);
  if (!r) return;
  document.getElementById("print").innerHTML = recipeDocBody(r, currentFactor(r));
  window.print();
}

async function shareRecipe(id) {
  const r = recipes.find(x => x.id === id);
  if (!r) return;
  const html = `<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1"><title>${esc(r.title)}</title>
    <style>body{font-family:system-ui,sans-serif;max-width:640px;margin:0 auto;padding:12px;font-size:18px}
    li{margin:4px 0}</style></head><body>${recipeDocBody(r, currentFactor(r))}</body></html>`;
  const base = (r.title.replace(/[^a-z0-9]+/gi, "-").replace(/^-|-$/g, "").toLowerCase()) || "recipe";
  const file = new File([html], base + ".html", { type: "text/html" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: r.title });
      return;
    } catch (e) {
      if (e.name === "AbortError") return;
    }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(file);
  a.download = file.name;
  a.click();
}

// ---- What can I cook? ----
function cookNowView() {
  let h = `<button class="mini" onclick="go('list')">← Back</button>
    <h2>What can I cook?</h2>
    <p class="small">Matches ingredient names in your inventory. Quantities are not checked here. Salt, pepper, water and oil are ignored.</p>`;
  if (!recipes.length) return h + `<p>Add some recipes first.</p>`;
  const inv = inventory.filter(i => !i.used);
  const rows = recipes.map(r => {
    const missing = [];
    let total = 0;
    for (const line of r.ingredients) {
      const p = parseIng(line);
      if (!p.name || STAPLES.includes(p.name)) continue;
      total++;
      if (!inv.some(it => namesMatch(it.name, p.name))) missing.push(p.name);
    }
    return { r, missing, total, have: total - missing.length };
  }).filter(x => x.total > 0)
    .sort((a, b) => a.missing.length - b.missing.length || a.r.activeMin - b.r.activeMin);

  const top = rows.slice(0, 3);
  if (!top.length) return h + `<p>No recipes to compare yet.</p>`;
  for (const x of top) {
    h += `<div class="card">
      <div class="head"><b>${esc(x.r.title)}</b>${starsInline(x.r.rating)}</div>
      <div class="small">You have ${x.have} of ${x.total} ingredients · Active ${x.r.activeMin} min</div>
      ${x.missing.length
        ? `<div class="small">Missing: ${esc(x.missing.map(cap).join(", "))}</div>`
        : `<div class="small">You have everything for this recipe.</div>`}
      ${allergenBadge(x.r)}
      <button class="mini" onclick="openRecipe('${x.r.id}')">Open</button>
    </div>`;
  }
  return h;
}

// ---- Addresses and driving time (OpenStreetMap lookup + OSRM route service, both free) ----
async function geocodeAddress(addr) {
  const url = "https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" + encodeURIComponent(addr);
  const r = await fetch(url);
  if (!r.ok) throw new Error("address lookup failed (" + r.status + ")");
  const d = await r.json();
  if (!d.length) throw new Error("address not found");
  return { lat: parseFloat(d[0].lat), lng: parseFloat(d[0].lon) };
}

// Driving time in whole minutes between two points (free-flow estimate, no live traffic).
async function drivingMinutes(fromLat, fromLng, toLat, toLng) {
  const url = `https://router.project-osrm.org/route/v1/driving/${fromLng},${fromLat};${toLng},${toLat}?overview=false`;
  const r = await fetch(url);
  if (!r.ok) throw new Error("route lookup failed (" + r.status + ")");
  const d = await r.json();
  if (!d.routes || !d.routes.length) throw new Error("no driving route found");
  return Math.round(d.routes[0].duration / 60);
}

// Looks up the home address once and recalculates all places.
async function updateHome() {
  const addr = (profile.homeAddress || "").trim();
  if (!addr) return;
  try {
    const c = await geocodeAddress(addr);
    profile.homeLat = c.lat;
    profile.homeLng = c.lng;
    profile.homeFor = addr;
    saveProfile();
    render();
    await updatePlaceDistances();
  } catch (e) {
    alert("Could not find the home address (" + e.message + "). Check the spelling, e.g. 'Musterstraße 1, 12345 Berlin'.");
    render();
  }
}

// Calculates driving time for every place whose address or home address changed.
// Each address is looked up once and stored, so it is not repeated every time.
async function updatePlaceDistances() {
  if (distanceBusy || profile.homeLat == null) return;
  const todo = places.filter(p => p.address && (p.homeFor !== profile.homeFor || p.addrFor !== p.address));
  if (!todo.length) return;
  distanceBusy = true;
  for (const p of todo) {
    distMsg = `Calculating driving time for ${p.name}…`;
    refreshListIfShown();
    try {
      if (p.addrFor !== p.address || p.lat == null) {
        const c = await geocodeAddress(p.address);
        p.lat = c.lat;
        p.lng = c.lng;
        p.addrFor = p.address;
        await sleep(1100); // public geocoder allows about one request per second
      }
      p.driveMin = await drivingMinutes(profile.homeLat, profile.homeLng, p.lat, p.lng);
      p.distErr = "";
    } catch (e) {
      p.driveMin = null;
      p.distErr = e.message;
    }
    p.homeFor = profile.homeFor;
    await sleep(400);
  }
  distanceBusy = false;
  distMsg = "";
  savePlaces();
  refreshListIfShown();
}

// Re-draws the places list only when it is visible and no form is open, so typed text is not lost.
function refreshListIfShown() {
  if ((tabName === "restaurants" || tabName === "playgrounds") && pmode.mode === "list") render();
}

// ---- Restaurants and playgrounds ----
// Both are stored in one list, told apart by kind ("restaurant" or "playground").
function placesOf(kind) { return places.filter(p => p.kind === kind); }

function visitCount(p) { return (p.visits || []).length; }
function lastVisit(p) {
  const v = (p.visits || []).map(x => x.date).sort();
  return v.length ? v[v.length - 1] : "";
}

// Happy Hour helpers. Days use JavaScript numbers: 0 = Sunday ... 6 = Saturday.
function hhLine(p) {
  const days = (p.hhDays && p.hhDays.length)
    ? HH_DAYS.filter(d => p.hhDays.includes(d[0])).map(d => d[1]).join(", ")
    : "Daily";
  const hrs = p.hhFrom && p.hhTo ? `${p.hhFrom}–${p.hhTo}` : "";
  return [days, hrs].filter(Boolean).join(" · ");
}
function hhNow(p) {
  if (!p.happyHour || !p.hhFrom || !p.hhTo) return false;
  const now = new Date();
  if (p.hhDays && p.hhDays.length && !p.hhDays.includes(now.getDay())) return false;
  const toMin = s => { const [h, m] = s.split(":").map(Number); return h * 60 + m; };
  const cur = now.getHours() * 60 + now.getMinutes();
  const a = toMin(p.hhFrom), b = toMin(p.hhTo);
  return b > a ? (cur >= a && cur < b) : (cur >= a || cur < b);
}

// Sorts by the chosen option, then applies the minimum-stars filter.
function sortPlaces(list) {
  const dm = p => (p.driveMin != null ? p.driveMin : 99999);
  const cmp = {
    drive: (a, b) => dm(a) - dm(b) || a.name.localeCompare(b.name),
    rating: (a, b) => (b.rating || 0) - (a.rating || 0) || dm(a) - dm(b),
    visits: (a, b) => visitCount(b) - visitCount(a) || dm(a) - dm(b),
    last: (a, b) => lastVisit(b).localeCompare(lastVisit(a)) || dm(a) - dm(b)
  }[placeSort];
  return list.filter(p => (p.rating || 0) >= placeMinStars).sort(cmp);
}

function placeFilterBar() {
  return `<div class="row">
    <label>Sort by <select onchange="placeSort=this.value;render()">${PLACE_SORTS.map(([v, l]) =>

    <label>Min. stars <select onchange="placeMinStars=+this.value;render()">${[0, 1, 2, 3, 4, 5].map(n =>

  </div>`;

// One place card. Restaurants show the Happy Hour block; both show photos, visits and history.
function placeCard(p) {
  const isR = p.kind === "restaurant";
  const photos = p.photos || [];
  const titleImg = photos.length ? `<img class="thumb" src="${photos[0]}" alt="">` : "";
  const gallery = photos.length > 1 ? `<div class="gallery">${photos.slice(1).map(s => `<img src="${s}" alt="">`).join("")}</div>` : "";
  const hh = isR && p.happyHour
    ? `<div class="hh">${hhNow(p) ? `<b class="hhnow">🍸 Happy Hour now!</b> · ` : "🍸 "}${esc(hhLine(p))}${p.hhDeal ? `<br>${esc(p.hhDeal)}` : ""}</div>`
    : "";
  const cnt = visitCount(p);
  const visited = cnt ? `Visited ${cnt}× · last ${fmtDate(lastVisit(p))}` : "Not visited yet";
  const history = cnt
    ? `<details><summary class="small">Visit history</summary>${(p.visits || []).slice().reverse().map(v =>
        `<div class="small">${fmtDate(v.date)}${v.note ? " · " + esc(v.note) : ""}</div>`).join("")}</details>`
    : "";
  const meta = [isR ? p.cuisine : p.zone, isR ? "" : p.price, p.notes].filter(Boolean).map(esc).join(" · ");
  return `<div class="card">${titleImg}
    <div class="head"><b>${isR && p.happyHour ? "🍸 " : ""}${esc(p.name)}</b>${starsInline(p.rating)}</div>

// Adds a visit for today with an optional note.
function logVisit(id) {
  const p = places.find(x => x.id === id);
  if (!p) return;
  const note = prompt("Visit note (optional, e.g. what you ate or played):", "");

  render();
}

      <button onclick="document.getElementById('pgal').click()">🖼 Choose photo</button>

// Draws the photo editor. The first photo is the title photo.
function drawPlacePhotos() {
  const box = document.getElementById("pphotos");
  if (!box) return;
  box.innerHTML = pDraftPhotos.map((src, i) => `<div class="pphoto">
      <img src="${src}" alt="" style="${i === 0 ? "outline:3px solid #2e7d32" : ""}">
      ${i === 0
        ? `<div class="small" style="color:#2e7d32;font-weight:700">Title photo</div>`
        : `<button class="mini" onclick="setTitlePhoto(${i})">Make title</button>`}
      <button class="mini" onclick="removePlacePhoto(${i})">✕</button>
    </div>`).join("") || `<p class="small">No photos yet.</p>`;
  const add = document.getElementById("pAddBtns");
  if (add) add.style.display = pDraftPhotos.length >= MAX_PLACE_PHOTOS ? "none" : "";
  const note = document.getElementById("pLimit");
  if (note) note.textContent = pDraftPhotos.length >= MAX_PLACE_PHOTOS ? `Maximum of ${MAX_PLACE_PHOTOS} photos reached. Remove one to add another.` : "";
}

function setTitlePhoto(i) {
  const [s] = pDraftPhotos.splice(i, 1);
  pDraftPhotos.unshift(s);
  drawPlacePhotos();
}

function removePlacePhoto(i) {
  pDraftPhotos.splice(i, 1);
  drawPlacePhotos();
}

async function pickPlacePhoto(input) {
  const file = input.files[0];
  input.value = "";
  if (!file) return;
  if (pDraftPhotos.length >= MAX_PLACE_PHOTOS) return alert(`Maximum of ${MAX_PLACE_PHOTOS} photos per place.`);
  try {
    pDraftPhotos.push(await shrinkImage(file, 640));
    drawPlacePhotos();
  } catch (e) {
    alert("Photo problem: " + e.message);
  }
}

function savePlace(kind, id) {
  const name = document.getElementById("pn").value.trim();
  if (!name) return alert("Please enter a name.");
  const address = document.getElementById("pa").value.trim();
  const data = {
    kind,
    name,
    address,
    rating: +document.getElementById("ratingData").value || 0,
    notes: document.getElementById("pno").value.trim(),
    photos: pDraftPhotos.slice(0, MAX_PLACE_PHOTOS)
  };
  if (kind === "restaurant") {
    data.cuisine = document.getElementById("pc").value.trim();
    data.happyHour = document.getElementById("phh").checked;
    data.hhDays = [...document.querySelectorAll(".hhday:checked")].map(x => +x.value);
    data.hhFrom = document.getElementById("hhf").value;
    data.hhTo = document.getElementById("hht").value;
    data.hhDeal = document.getElementById("hhd").value.trim();

    data.zone = document.getElementById("pz").value;

// ---- Pick for me (random choice within your filters) ----
function togglePick() {
  pickState.open = !pickState.open;
  pickState.result = null;
  pickState.msg = "";
  render();
}

// kind is "recipes", "restaurant" or "playground"
function pickPanel(kind) {
  if (!pickState.open) return "";
  const isPlace = kind !== "recipes";
  const maxSel = isPlace
    ? `<label>Max. driving time <select onchange="pickState.maxMin=+this.value">${[[0, "Any"], [10, "10 min"], [15, "15 min"], [20, "20 min"], [30, "30 min"], [45, "45 min"], [60, "60 min"]].map(([v, l]) =>
        `<option value="${v}" ${v === pickState.maxMin ? "selected" : ""}>${l}</option>`).join("")}</select></label>`
    : "";
  const stars = `<label>Min. stars <select onchange="pickState.minStars=+this.value">${[0, 1, 2, 3, 4, 5].map(n =>
    `<option value="${n}" ${n === pickState.minStars ? "selected" : ""}>${n ? n + "+ ★" : "Any"}</option>`).join("")}</select></label>`;
  return `<div class="card">
    <h3>🎲 Pick for me</h3>
    <div class="row">${maxSel}${stars}</div>
    <button onclick="pickNow('${kind}')">Pick one</button>
    ${pickResult()}
  </div>`;
}

function pickNow(kind) {
  const minStars = pickState.minStars || 0;
  const maxMin = kind === "recipes" ? 0 : (pickState.maxMin || 0);
  let pool;
  if (kind === "recipes") {
    pool = recipes.filter(r => catOf(r) === recipeCat && (r.rating || 0) >= minStars);
  } else {
    pool = placesOf(kind).filter(p =>
      (p.rating || 0) >= minStars &&
      (!maxMin || (p.driveMin != null && p.driveMin <= maxMin)));
  }
  if (!pool.length) {
    pickState.result = null;
    pickState.msg = "Nothing matches. Try fewer stars or more driving time.";
  } else {
    const x = pool[Math.floor(Math.random() * pool.length)];
    pickState.result = { type: kind, id: x.id };
    pickState.msg = "";
  }
  render();
}

function pickResult() {
  const x = pickState.result;
  if (!x) return pickState.msg ? `<p class="small">${esc(pickState.msg)}</p>` : "";
  if (x.type === "recipes") {
    const r = recipes.find(y => y.id === x.id);
    if (!r) return "";
    return `<div class="card" style="margin-bottom:0">
      <div class="head"><b>🎲 ${esc(r.title)}</b>${starsInline(r.rating)}</div>
      <div class="small">${esc(CAT_LABEL[catOf(r)])} · Active ${r.activeMin} min</div>
      <button class="mini" onclick="openRecipe('${r.id}')">Open</button>
      <button class="mini" onclick="pickNow('recipes')">Pick another</button>
    </div>`;
  }
  const p = places.find(y => y.id === x.id);
  if (!p) return "";
  return `<div class="card" style="margin-bottom:0">
    <div class="head"><b>🎲 ${p.kind === "restaurant" && p.happyHour ? "🍸 " : ""}${esc(p.name)}</b>${starsInline(p.rating)}</div>
    ${driveLine(p)}

    <button class="mini" onclick="pickNow('${x.type}')">Pick another</button>
  </div>`;
}

// ---- Recipe photos ----
// Shrinks a photo to maxW pixels wide and compresses it, so it stays small in the sync file.
function shrinkImage(file, maxW = 800) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const scale = Math.min(1, maxW / img.width);
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL("image/jpeg", 0.8));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("could not read that image")); };
    img.src = url;
  });
}

async function pickPhoto(input) {
  const file = input.files[0];
  input.value = "";
  if (!file) return;
  try {
    const data = await shrinkImage(file);
    document.getElementById("photoData").value = data;
    const p = document.getElementById("photoPreview");
    p.src = data;
    p.style.display = "block";
  } catch (e) {
    alert("Photo problem: " + e.message);
  }
}

function clearPhoto() {
  document.getElementById("photoData").value = "";
  const p = document.getElementById("photoPreview");
  p.removeAttribute("src");
  p.style.display = "none";
}

// ---- Swipe inspiration ----
function swipeDeck() {
  const seen = new Set([...swipe.liked, ...swipe.passed]);
  return recipes.filter(r => !seen.has(r.id));
}

function swipeView() {
  let h = `<h2>Inspiration</h2>`;
  if (!recipes.length) return h + `<p>Add some recipes first, then swipe through them here.</p>`;
  const deck = swipeDeck();
  if (!deck.length) {
    h += `<p>You've seen all your recipes.</p>
      <button onclick="resetSwipe()">Show all again</button>`;
    return h + savedList() + passedList();
  }
  const r = deck[0];
  // The hint sits outside the moving card, so PASS / SAVE stays visible while you swipe.
  h += `<p class="small">Swipe right to save, left to pass. You can also use the buttons.</p>
  <div class="row-btns swipe-btns">
    <button class="btn-pass" onclick="swipeAction('pass')">✕ Pass</button>
    <button class="btn-save" onclick="swipeAction('like')">♥ Save</button>

      <div class="small">Cooked ${r.cookCount || 0}×</div>

      <button onclick="openRecipe('${r.id}')">Open full recipe</button>

function savedList() {
  const saved = swipe.liked.map(id => recipes.find(r => r.id === id)).filter(Boolean);
  let h = `<h3>Saved (${saved.length})</h3>`;
  if (!saved.length) h += `<p class="small">Nothing saved yet.</p>`;
  for (const r of saved) {
    h += `<div class="card"><div class="head"><b>${esc(r.title)}</b>${starsInline(r.rating)}</div>
      <div class="small">Active ${r.activeMin} min · Serves ${r.servings}</div>
      <button class="mini" onclick="openRecipe('${r.id}')">Open</button></div>`;
  }
  return h;
}

function passedList() {
  const passed = swipe.passed.map(id => recipes.find(r => r.id === id)).filter(Boolean);
  let h = `<h3>Passed (${passed.length})</h3>`;
  if (!passed.length) h += `<p class="small">Nothing passed yet.</p>`;
  for (const r of passed) {
    h += `<div class="card"><div class="head"><b>${esc(r.title)}</b>${starsInline(r.rating)}</div>
      <div class="small">Active ${r.activeMin} min · Serves ${r.servings}</div>
      <button class="mini" onclick="openRecipe('${r.id}')">Open</button></div>`;
  }
  return h;
}

function swipeAction(action) {
  const r = swipeDeck()[0];
  if (!r) return;
  if (action === "like") swipe.liked.push(r.id);
  else swipe.passed.push(r.id);
  saveSwipe();
  render();
}

function resetSwipe() {
  swipe.passed = [];
  saveSwipe();
  render();
}

// Shows a large SAVE or PASS label in the middle of the swipe area, depending on drag direction.
function setHint(dx) {
  const hint = document.getElementById("hint");
  if (!hint) return;
  if (dx > 60) { hint.textContent = "♥ SAVE"; hint.className = "hint save"; }
  else if (dx < -60) { hint.textContent = "✕ PASS"; hint.className = "hint pass"; }
  else { hint.textContent = ""; hint.className = "hint"; }
}

function attachSwipe() {
  const el = document.getElementById("card");
  if (!el) return;
  let startX = null, dx = 0;

  el.addEventListener("pointerdown", e => {
    startX = e.clientX; dx = 0;
    el.style.transition = "none";
  });
  el.addEventListener("pointermove", e => {
    if (startX === null) return;
    dx = e.clientX - startX;
    el.style.transform = `translateX(${dx}px) rotate(${dx / 25}deg)`;
    setHint(dx);
  });
  const release = () => {
    if (startX === null) return;
    const d = dx;
    startX = null; dx = 0;
    if (d > 100) flyOut(el, 1, () => swipeAction("like"));
    else if (d < -100) flyOut(el, -1, () => swipeAction("pass"));
    else {
      el.style.transition = "transform .2s";
      el.style.transform = "";
      setHint(0);
    }
  };
  el.addEventListener("pointerup", release);
  el.addEventListener("pointercancel", release);
}

function flyOut(el, dir, done) {
  el.style.transition = "transform .25s";
  el.style.transform = `translateX(${dir * 600}px) rotate(${dir * 30}deg)`;
  setTimeout(done, 250);
}

// ---- Bulk upload ----
// Reads CSV text into objects. Header names are lowercased, with spaces turned into underscores.
function parseCSV(text) {
  const rows = [];
  let row = [], cur = "", inQuotes = false;
  text = text.replace(/^\uFEFF/, "");
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"' && text[i + 1] === '"') { cur += '"'; i++; }
      else if (c === '"') inQuotes = false;
      else cur += c;
    } else if (c === '"') {
      inQuotes = true;
    } else if (c === ",") {
      row.push(cur); cur = "";
    } else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(cur); cur = "";
      if (row.some(x => x.trim() !== "")) rows.push(row);
      row = [];
    } else {
      cur += c;
    }
  }
  row.push(cur);
  if (row.some(x => x.trim() !== "")) rows.push(row);
  if (rows.length < 2) return [];
  const headers = rows[0].map(h => h.trim().toLowerCase().replace(/\s+/g, "_"));
  return rows.slice(1).map(r => {
    const o = {};
    headers.forEach((h, i) => o[h] = (r[i] || "").trim());
    return o;
  });
}

// Checks one inventory row and turns it into an item. Problems are listed in err.
function bulkInventoryRows(rows) {
  return rows.map((r, n) => {
    const err = [];
    const name = r.name || "";
    if (!name) err.push("name missing");
    const storage = (r.storage || "fridge").toLowerCase();
    if (!STORAGE_OK.includes(storage)) err.push("storage must be freezer, fridge or pantry");
    let expiry = r.expiry || "";
    let expirySource = "user";
    if (!expiry) {
      expiry = addDays(DEFAULT_DAYS[storage] || 7);
      expirySource = "rule";
    } else if (!/^\d{4}-\d{2}-\d{2}$/.test(expiry)) {
      err.push("expiry must be YYYY-MM-DD");
    }
    return {
      row: n + 2,
      err,
      data: {
        name,
        qty: r.qty || "1",
        unit: normUnit(r.unit || "count"),
        storage: STORAGE_OK.includes(storage) ? storage : "fridge",
        expiry,
        expirySource,
        quality: "best by"
      }
    };
  });
}

// Checks one recipe row. Ingredients and steps are separated by the | character.
function bulkRecipeRows(rows) {
  const existing = new Set(recipes.map(r => r.title.trim().toLowerCase()));
  const seenInFile = new Set();
  const split = s => (s || "").split("|").map(x => x.trim()).filter(Boolean);
  return rows.map((r, n) => {
    const err = [];
    const title = r.title || "";
    const key = title.trim().toLowerCase();
    const ingredients = split(r.ingredients);
    const steps = split(r.steps);
    if (!title) err.push("title missing");
    if (!ingredients.length) err.push("no ingredients");
    if (key && existing.has(key)) err.push("a recipe with this title already exists (skipped)");
    if (key && seenInFile.has(key)) err.push("duplicate title in this file (skipped)");
    seenInFile.add(key);
    return {
      row: n + 2,
      err,
      data: {
        title,
        category: normCat(r.category),
        servings: +r.servings || profile.defaultServings,
        activeMin: +r.active_min || 0,
        totalMin: +r.total_min || 0,
        ingredients,
        steps,
        cookCount: 0,
        source: "Bulk upload"
      }
    };
  });
}

function bulkPick(kind) {
  const f = document.getElementById("bulkFile");
  f.dataset.kind = kind;
  f.click();
}

async function readBulk(input) {
  const file = input.files[0];
  const kind = input.dataset.kind;
  input.value = "";
  if (!file) return;
  try {
    const text = await file.text();
    let rows;
    if (file.name.toLowerCase().endsWith(".json")) {
      const data = JSON.parse(text);
      if (!Array.isArray(data)) throw new Error("the JSON file must contain a list");
      rows = data.map(x => kind === "recipes" ? {
        title: x.title,
        category: x.category,
        servings: x.servings,
        active_min: x.activeMin ?? x.active_min,
        total_min: x.totalMin ?? x.total_min,
        ingredients: Array.isArray(x.ingredients) ? x.ingredients.join("|") : x.ingredients,
        steps: Array.isArray(x.steps) ? x.steps.join("|") : x.steps
      } : Object.fromEntries(Object.entries(x).map(([k, v]) => [k.toLowerCase(), v == null ? "" : String(v)])));
    } else {
      rows = parseCSV(text);
    }
    if (!rows.length) return alert("No rows found. Check that the first line has the column names.");
    const items = kind === "recipes" ? bulkRecipeRows(rows) : bulkInventoryRows(rows);
    view = { name: "bulk", kind, items };
    tabName = kind === "recipes" ? "recipes" : "inventory";
    render();
  } catch (e) {
    alert("Could not read the file: " + e.message);
  }
}

function bulkView() {
  const { kind, items } = view;
  const ok = items.filter(i => !i.err.length);
  const label = kind === "recipes" ? "recipes" : "inventory items";
  let h = `<button class="mini" onclick="cancelBulk()">← Back</button>
    <h2>Review ${label} upload</h2>
    <p class="small">${ok.length} ready to import, ${items.length - ok.length} skipped. Nothing is saved until you confirm.</p>`;
  for (const it of items.slice(0, 50)) {
    const d = it.data;
    const title = kind === "recipes"
      ? d.title
      : `${d.name} · ${d.qty} ${unitLabel(d.unit)} · ${d.storage}`;
    h += `<div class="card ${it.err.length ? "warn" : ""}">
      <b>${esc(title || "(no title)")}</b>
      ${kind === "recipes"
        ? `<div class="small">${esc(d.category)} · Serves ${d.servings} · ${d.ingredients.length} ingredients · ${d.steps.length} steps</div>`
        : `<div class="small">${d.expiry ? "Exp. " + esc(fmtDate(d.expiry)) : ""}${d.expirySource === "rule" ? " (estimate)" : ""}</div>`}
      ${it.err.length ? `<div class="alert">Row ${it.row}: ${esc(it.err.join("; "))}</div>` : ""}
    </div>`;
  }
  if (items.length > 50) h += `<p class="small">Showing the first 50 of ${items.length} rows. The import includes all ready rows.</p>`;
  if (ok.length) h += `<button onclick="confirmBulk()">Import ${ok.length} ${label}</button>`;
  h += `<button onclick="cancelBulk()">Cancel</button>`;
  return h;
}

function confirmBulk() {
  const ok = view.items.filter(i => !i.err.length).map(i => i.data);
  const kind = view.kind;
  if (kind === "recipes") {
    ok.forEach(d => recipes.push({ id: uid(), ...d }));
    save();
  } else {
    ok.forEach(d => inventory.push({ id: uid(), used: false, ...d }));
    saveInventory();
  }
  tab(kind === "recipes" ? "recipes" : "inventory");
  alert(`Imported ${ok.length} ${kind === "recipes" ? "recipe(s)" : "inventory item(s)"}.`);
}

function cancelBulk() {
  tab(view.kind === "recipes" ? "recipes" : "inventory");
}

// Downloads a CSV with the right column names and one example row.
function downloadTemplate(kind) {
  const csv = kind === "recipes"
    ? 'title,category,servings,active_min,total_min,ingredients,steps\n"Pancakes",Baking,4,10,25,"1 cup flour|1 egg|1 cup milk","Mix everything|Cook 2 min per side"'
    : "name,qty,unit,storage,expiry,quality\nMilk,1,gallon,fridge,,best by\nRice,500,g,pantry,2027-06-01,best by";
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
  a.download = kind + "-template.csv";
  a.click();
}

// ---- Meal plan (recipes and places, one line per entry) ----
function planView() {
  let h = `<h2>Meal plan</h2>`;
  if (!recipes.length && !places.length) {
    return h + `<p>Add a recipe, restaurant or playground first, then you can plan it here.</p>`;
  }
  const recOpts = recipes.map(r =>
    `<option value="r:${r.id}" ${planDraft.target === "r:" + r.id ? "selected" : ""}>${esc(r.title)}</option>`).join("");
  const restOpts = placesOf("restaurant").map(p =>
    `<option value="p:${p.id}" ${planDraft.target === "p:" + p.id ? "selected" : ""}>${esc(p.name)}</option>`).join("");
  const playOpts = placesOf("playground").map(p =>
    `<option value="p:${p.id}" ${planDraft.target === "p:" + p.id ? "selected" : ""}>${esc(p.name)}</option>`).join("");
  const groups = `<option value="">Choose…</option>
    ${recOpts ? `<optgroup label="Recipes">${recOpts}</optgroup>` : ""}
    ${restOpts ? `<optgroup label="Restaurants">${restOpts}</optgroup>` : ""}
    ${playOpts ? `<optgroup label="Playgrounds">${playOpts}</optgroup>` : ""}`;
  const isRecipe = planDraft.target.startsWith("r:");
  h += `<div class="card">
    <div class="plan-add">
      <input type="date" class="pa-date" title="Date" value="${planDraft.date}" onchange="planDraft.date=this.value">
      <select class="pa-meal" title="Meal" onchange="planDraft.meal=this.value">
        ${MEALS.map(m => `<option value="${m}" ${m === planDraft.meal ? "selected" : ""}>${m}</option>`).join("")}
      </select>
      <select class="pa-recipe" title="Recipe or place" onchange="planDraft.target=this.value;planDraft.servings='';render()">${groups}</select>
      ${isRecipe ? `<input type="number" class="pa-serv" min="1" title="Servings" value="${planDraft.servings}" placeholder="serv."
        onchange="planDraft.servings=this.value">` : ""}
      <button class="mini" onclick="addPlanEntry()">Add</button>
    </div>
  </div>`;

  const sorted = [...plan].sort((a, b) =>
    a.date === b.date ? MEALS.indexOf(a.meal) - MEALS.indexOf(b.meal) : a.date.localeCompare(b.date));
  if (!sorted.length) h += `<p>Nothing planned yet.</p>`;
  for (const e of sorted) {
    if (e.placeId) {
      const p = places.find(x => x.id === e.placeId);
      h += `<div class="line ${e.cooked ? "cooked" : ""}">
        <span class="ell"><b>${esc(niceDate(e.date))}</b> · ${esc(e.meal)} · 📍 ${p ? esc(p.name) : "(place deleted)"}${e.cooked ? " · ✓" : ""}</span>
        ${p && !e.cooked ? `<button class="mini" onclick="visitFromPlan('${e.id}')">Visited</button>` : ""}
        <button class="mini" onclick="removePlan('${e.id}')">✕</button>
      </div>`;
      continue;
    }
    const r = recipes.find(x => x.id === e.recipeId);
    const canUndo = e.cooked && lastCook && lastCook.planId === e.id;
    const allergyFlag = r && recipeAllergens(r).some(a => profile.allergens.includes(a.key)) ? " ⚠" : "";
    h += `<div class="line ${e.cooked ? "cooked" : ""}">
      <span class="ell"><b>${esc(niceDate(e.date))}</b> · ${esc(e.meal)} · ${r ? esc(r.title) : "(recipe deleted)"} · ${e.servings}${allergyFlag}${e.cooked ? " · ✓" : ""}</span>
      ${r && !e.cooked ? `<button class="mini" onclick="markCooked('${e.id}')">Cooked</button>` : ""}
      ${canUndo ? `<button class="mini" onclick="undoCook()">Undo</button>` : ""}
      <button class="mini" onclick="removePlan('${e.id}')">✕</button>
    </div>`;
  }

  h += `<h2>Shopping list</h2>
    <div class="row">
      <label>From <input type="date" value="${planDraft.from}" onchange="planDraft.from=this.value"></label>

      <button class="mini" onclick="buildShop()">Build shopping list</button>
      <button class="mini" onclick="uncheckAll()">Uncheck all</button>
      <button class="mini" onclick="copyShopping()">Copy list</button>
    </div>`;

  if (shopResult) h += shopView(shopResult);

  h += `<h3>Extra items</h3>
    <div class="row">
      <input placeholder="e.g. paper towels" value="${esc(planDraft.manual)}" onchange="planDraft.manual=this.value">
      <button class="mini" onclick="addManual()">Add</button>
    </div>`;
  if (!shop.manual.length) h += `<p class="small">No extra items.</p>`;
  for (const m of shop.manual) {
    h += `<div class="line ${m.checked ? "done" : ""}">
      <input type="checkbox" ${m.checked ? "checked" : ""} onchange="toggleManual('${m.id}')">
      <span class="ell">${esc(m.name)}</span>
      <button class="mini" onclick="removeManual('${m.id}')">✕</button>
    </div>`;
  }
  return h;
}

// Compact "to buy" list: one line per item.
function shopView(res) {
  const toBuy = res.rows.filter(r => r.buy > 0.001);
  const enough = res.rows.filter(r => r.buy <= 0.001);
  let h = `<h3>To buy</h3>`;
  if (!toBuy.length) h += `<p>Nothing to buy for this range.</p>`;
  for (const r of toBuy) {
    const idx = res.rows.indexOf(r);
    const checked = !!shop.checked[r.key];
    const warn = r.notCompared.length ? ` <span title="In inventory but can't be converted: ${esc(r.notCompared.join(", "))}">⚠</span>` : "";
    h += `<div class="line ${checked ? "done" : ""}">
      <input type="checkbox" ${checked ? "checked" : ""} onchange="toggleCheck(${idx})">
      <span class="ell"><b>${esc(cap(r.name))}</b> · buy ${esc(fmtAmount(r.kind, r.buy))} <span class="small">(need ${esc(fmtAmount(r.kind, r.need))}, have ${esc(fmtAmount(r.kind, r.have))})</span>${warn}</span>
    </div>`;
  }
  if (enough.length) {
    h += `<h3>Already have enough</h3>`;
    h += enough.map(r => `<div class="small">${esc(cap(r.name))} (need ${esc(fmtAmount(r.kind, r.need))}, have ${esc(fmtAmount(r.kind, r.have))})</div>`).join("");
  }
  if (res.unparsed.length) {
    h += `<h3>Check by hand</h3><p class="small">These lines have no amount, so they aren't in the totals:</p>`;
    h += res.unparsed.map(l => `<div class="small">${esc(l)}</div>`).join("");
  }
  return h;
}

// Copies the items still to buy (not ticked) as plain text, for WhatsApp, Notes or email.
function copyShopping() {
  if (!shopResult) return alert("Build the shopping list first.");
  const lines = shopResult.rows
    .filter(r => r.buy > 0.001 && !shop.checked[r.key])
    .map(r => `- ${cap(r.name)}: ${fmtAmount(r.kind, r.buy)}`);
  shop.manual.filter(m => !m.checked).forEach(m => lines.push(`- ${m.name}`));
  if (!lines.length) return alert("Nothing to copy. Everything is ticked or nothing is needed.");
  const text = "Shopping list\n" + lines.join("\n");
  const done = () => alert("Shopping list copied. You can paste it into WhatsApp, Notes or email.");
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}

function fallbackCopy(text, done) {
  const t = document.createElement("textarea");
  t.value = text;
  t.style.position = "fixed";
  t.style.opacity = "0";
  document.body.appendChild(t);
  t.select();
  try { document.execCommand("copy"); } catch (e) {}
  t.remove();
  done();
}

// Adds a recipe or a place to the plan. The target is "r:<id>" for recipes or "p:<id>" for places.
function addPlanEntry() {
  const [kind, id] = (planDraft.target || "").split(":");
  if (!id) return alert("Choose a recipe, restaurant or playground first.");
  if (kind === "r") {
    const r = recipes.find(x => x.id === id);
    if (!r) return alert("Choose a recipe first.");
    plan.push({
      id: uid(),
      date: planDraft.date,
      meal: planDraft.meal,
      recipeId: r.id,
      servings: +planDraft.servings || r.servings,
      cooked: false
    });
  } else {
    const p = places.find(x => x.id === id);
    if (!p) return alert("Choose a place first.");
    plan.push({
      id: uid(),
      date: planDraft.date,
      meal: planDraft.meal,
      placeId: p.id,
      cooked: false
    });
  }
  savePlan();
  planDraft.servings = "";
  render();
}

function removePlan(id) {
  plan = plan.filter(e => e.id !== id);
  savePlan();
  render();
}

// Marks a planned restaurant or playground visit as done and logs it in the place's visit history.
function visitFromPlan(id) {
  const e = plan.find(x => x.id === id);
  if (!e) return;
  const p = places.find(x => x.id === e.placeId);
  if (!p) return;
  (p.visits = p.visits || []).push({ date: e.date, note: "" });
  e.cooked = true;
  savePlaces();
  savePlan();
  render();
}

// Takes ingredients out of inventory, counts the cook for the recipe, and keeps a snapshot for Undo.
function markCooked(id) {
  const e = plan.find(x => x.id === id);
  if (!e || e.cooked) return;
  const r = recipes.find(x => x.id === e.recipeId);
  if (!r) return alert("This recipe was deleted.");
  if (!confirm(`Take the ingredients for "${r.title}" out of your inventory?`)) return;

  lastCook = { planId: id, recipeId: r.id, inventory: JSON.stringify(inventory) };
  localStorage.setItem(LKEY, JSON.stringify(lastCook));

  const f = e.servings / r.servings;
  const used = [];
  const short = [];
  const byExpiry = (a, b) => (a.expiry || "9999-12-31").localeCompare(b.expiry || "9999-12-31");

  for (const line of r.ingredients) {
    const p = parseIng(line);
    if (p.qty === null || !p.name) { short.push(line + " (no amount)"); continue; }
    const need = normalizeNeed(p.qty * f, p.unit, p.name);
    let remaining = need.amount;
    let took = 0;
    const matches = inventory.filter(i => !i.used && namesMatch(i.name, p.name)).sort(byExpiry);

    for (const it of matches) {
      if (remaining <= 0.001) break;
      const q = parseQty(it.qty || "");
      if (!q) continue;
      const avail = amountIn(need.kind, q.v, normUnit(it.unit), it.name);
      if (avail === null) continue;
      const useAmt = Math.min(avail, remaining);
      remaining -= useAmt;
      took += useAmt;
      const left = avail - useAmt;
      if (left <= 0.001) it.used = true;
      else it.qty = fmt(q.v * left / avail);
    }

    if (took > 0) used.push(`${cap(p.name)}: ${fmtAmount(need.kind, took)}`);
    if (remaining > 0.001) {
      short.push(took > 0
        ? `${cap(p.name)}: short by ${fmtAmount(need.kind, remaining)}`
        : `${cap(p.name)}: not found in inventory with a usable unit (edit the item's unit or add a count)`);
    }
  }

  e.cooked = true;
  r.cookCount = (r.cookCount || 0) + 1;
  saveInventory();
  savePlan();
  save();
  let msg = used.length ? "Taken from inventory:\n- " + used.join("\n- ") : "Nothing was taken from inventory.";
  if (short.length) msg += "\n\nCheck by hand:\n- " + short.join("\n- ");
  msg += `\n\nCooked count for "${r.title}": ${r.cookCount}.\nUse 'Undo' to reverse this.`;
  alert(msg);
  render();
}

// Restores inventory and the cook count to how they were before the last Mark cooked.
function undoCook() {
  if (!lastCook) return;
  if (!confirm("Undo the last Mark cooked? Inventory and the cook count go back to how they were before, so any edits made since are lost.")) return;
  inventory = JSON.parse(lastCook.inventory);
  saveInventory();
  const e = plan.find(x => x.id === lastCook.planId);
  if (e) e.cooked = false;
  savePlan();
  const rec = recipes.find(x => x.id === lastCook.recipeId);
  if (rec) rec.cookCount = Math.max(0, (rec.cookCount || 1) - 1);
  save();
  lastCook = null;
  localStorage.removeItem(LKEY);
  render();
}

function computeShopping(from, to) {
  const needs = {};
  const unparsed = [];
  for (const e of plan) {
    if (e.date < from || e.date > to || !e.recipeId) continue;
    const r = recipes.find(x => x.id === e.recipeId);
    if (!r) continue;
    const f = e.servings / r.servings;
    for (const line of r.ingredients) {
      const p = parseIng(line);
      if (p.qty === null || !p.name) { unparsed.push(line); continue; }
      const need = normalizeNeed(p.qty * f, p.unit, p.name);
      const key = p.name + "|" + need.kind;
      if (!needs[key]) needs[key] = { name: p.name, kind: need.kind, base: 0 };
      needs[key].base += need.amount;
    }
  }

  const invItems = inventory.filter(i => !i.used);
  const rows = Object.entries(needs).map(([key, n]) => {
    let have = 0;
    const notCompared = [];
    for (const it of invItems) {
      if (!namesMatch(it.name, n.name)) continue;
      const q = parseQty(it.qty || "");
      if (!q) continue;
      const avail = amountIn(n.kind, q.v, normUnit(it.unit), it.name);
      if (avail === null) notCompared.push(`${it.qty} ${unitLabel(it.unit)} ${it.name}`.trim());
      else have += avail;
    }
    return {
      key, name: n.name, kind: n.kind,
      need: n.base, have,
      buy: Math.max(0, n.base - have),
      notCompared
    };
  }).sort((a, b) => a.name.localeCompare(b.name));
  return { rows, unparsed };
}

function buildShop() {
  shopResult = computeShopping(planDraft.from, planDraft.to);
  render();
}

function toggleCheck(idx) {
  const r = shopResult.rows[idx];
  shop.checked[r.key] = !shop.checked[r.key];
  saveShop();
  render();
}

function addManual() {
  const name = planDraft.manual.trim();
  if (!name) return alert("Type an item first.");
  shop.manual.push({ id: uid(), name, checked: false });
  planDraft.manual = "";
  saveShop();
  render();
}

function toggleManual(id) {
  const m = shop.manual.find(x => x.id === id);
  if (m) m.checked = !m.checked;
  saveShop();
  render();
}

function removeManual(id) {
  shop.manual = shop.manual.filter(x => x.id !== id);
  saveShop();
  render();
}

function uncheckAll() {
  shop.checked = {};
  shop.manual.forEach(m => m.checked = false);
  saveShop();
  render();
}

];

// Translates one piece of text. The English original is kept on each text node so switching back works.
function translateText(en) {
  if (lang !== "de") return en;
  const k = en.trim();
  if (!k) return en;
  if (DE[k]) return en.replace(k, () => DE[k]);
  for (const [re, rep] of DE_PATTERNS) {
    if (re.test(k)) return en.replace(k, () => k.replace(re, rep));
  }
  return en;
}

// Walks the page's text and applies the chosen language.
function applyLang() {
  document.documentElement.lang = lang;
  const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const node of nodes) {
    const parent = node.parentNode;
    if (!parent || ["SCRIPT", "STYLE", "TEXTAREA"].includes(parent.nodeName)) continue;
    if (parent.closest && parent.closest("#print")) continue;
    if (node._en === undefined) node._en = node.nodeValue;
    node.nodeValue = translateText(node._en);
  }
  document.querySelectorAll("input[placeholder], textarea[placeholder]").forEach(el => {
    if (!el._enPh) el._enPh = el.placeholder;
    el.placeholder = lang === "de" && DE[el._enPh] ? DE[el._enPh] : el._enPh;
  });
}

function toggleLang() {
  lang = lang === "de" ? "en" : "de";
  localStorage.setItem("lang_v1", lang);
  applyLang();
  render();
}

// Every screen refresh also applies the chosen language.
const renderBase = render;
render = function () { renderBase(); applyLang(); };

});
